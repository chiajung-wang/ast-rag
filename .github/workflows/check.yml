name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # The suite must not need an index or an API key. Unset them explicitly
      # so a test that quietly starts depending on either fails here first.
      - name: Run tests
        env:
          OPENROUTER_API_KEY: ""
        run: uv run pytest tests/ -v
